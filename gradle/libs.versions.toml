[versions]
# Kotlin 2.4.0-Beta2 ships Swift Export Flow→AsyncSequence interop (KT-64572).
# https://kotlinlang.org/docs/whatsnew-eap.html#swift-export-support-for-exporting-coroutine-flows
kotlin = "2.4.0-Beta2"
# KSP2 is decoupled from Kotlin version since 2.3.0, so 2.3.7 works with 2.4.x.
ksp = "2.3.7"
compose = "1.10.3"
serialization = "1.10.0"
datetime = "0.7.1"
room3 = "3.0.0-alpha03"
sqlite = "2.7.0-alpha03"
kermit = "2.0.8"
#ksp = "2.3.8"
#compose = "1.11.0"
coroutines = "1.10.2"
#serialization = "1.11.0"
#datetime = "0.8.0"
ktor = "3.4.1"
slf4j = "2.0.18"
junit = "6.1.0"
#room3 = "3.0.0-alpha05"
#sqlite = "2.7.0-alpha05"
#kermit = "2.1.0"
datastore = "1.2.1"
okio = "3.17.0"

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidxRoom3 = { id = "androidx.room3", version.ref = "room3" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging-jvm", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
androidx-datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }
androidx-datastore-core-okio = { module = "androidx.datastore:datastore-core-okio", version.ref = "datastore" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
