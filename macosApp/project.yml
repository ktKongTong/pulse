name: PulseBarNative
options:
  minimumXcodeGenVersion: 2.45.3
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: io.github.kt.pulsebar.native
    PRODUCT_NAME: PulseBarNative
    SWIFT_VERSION: "6.0"
    ENABLE_DEBUG_DYLIB: NO
    LM_SKIP_METADATA_EXTRACTION: YES
    CODE_SIGN_ENTITLEMENTS: PulseBarNative/PulseBarNative.entitlements
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: NO
    INFOPLIST_KEY_NSAppleEventsUsageDescription: PulseBar reads browser and Spotify metadata to show the current status in the menu bar.
    OTHER_LDFLAGS: "$(inherited) -lsqlite3"
targets:
  PulseBarNative:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - PulseBarNative
    preBuildScripts:
      - name: Embed Swift Export
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="$HOME/Library/Java/JavaVirtualMachines/jbr-21.0.9/Contents/Home"
          export PATH="$JAVA_HOME/bin:$PATH"
          export GRADLE_USER_HOME="$SRCROOT/../.gradle-xcode"
          export KONAN_DATA_DIR="${KONAN_DATA_DIR:-$HOME/.konan}"
          ./gradlew --no-daemon -Dorg.gradle.vfs.watch=false :common:embedSwiftExportForXcode
          touch "$DERIVED_FILE_DIR/embed-swift-export.stamp"
        outputFiles:
          - $(DERIVED_FILE_DIR)/embed-swift-export.stamp
