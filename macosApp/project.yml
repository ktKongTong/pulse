name: PulseBarNative
options:
  minimumXcodeGenVersion: 2.45.3
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: io.github.kt.pulsebar.native
    PRODUCT_NAME: PulseBarNative
    SWIFT_VERSION: "6.0"
    ENABLE_DEBUG_DYLIB: NO
    LM_SKIP_METADATA_EXTRACTION: YES
    CODE_SIGN_ENTITLEMENTS: PulseBarNative/PulseBarNative.entitlements
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    OTHER_LDFLAGS: "$(inherited) -lsqlite3"
targets:
  PulseBarNative:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - PulseBarNative
    info:
      path: PulseBarNative/Info.plist
      properties:
        LSUIElement: false
        NSAppleEventsUsageDescription: PulseBar reads browser and Spotify metadata to show the current status in the menu bar.
        NSAudioCaptureUsageDescription: PulseBar captures system audio for Stream streams after you start capture.
        NSScreenCaptureUsageDescription: PulseBar may need screen and system audio recording permission to capture Stream audio.
    preBuildScripts:
      - name: Embed Swift Export
        script: |
          cd "$SRCROOT/.."
          ./gradlew :common:embedSwiftExportForXcode
